<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#090d18" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="flow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="flow-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter Shadows -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes dashflow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { r: 3; opacity: 0.4; }
        50% { r: 6; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes floatCardA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCardB {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes beamShimmer {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }
      .anim-flow-1 {
        stroke-dasharray: 20 40;
        animation: dashflow 14s linear infinite;
      }
      .anim-flow-2 {
        stroke-dasharray: 30 50;
        animation: dashflow 18s linear infinite reverse;
      }
      .anim-flow-3 {
        stroke-dasharray: 15 35;
        animation: dashflow 12s linear infinite;
      }
      .pulse-1 { animation: pulseDot 3s ease-in-out infinite; }
      .pulse-2 { animation: pulseDot 4s ease-in-out infinite 1.5s; }
      .pulse-3 { animation: pulseDot 3.5s ease-in-out infinite 0.7s; }
      .card-float-left { animation: floatCardA 6s ease-in-out infinite; }
      .card-float-right { animation: floatCardB 7s ease-in-out infinite; }
      .card-float-bottom { animation: floatCardA 8s ease-in-out infinite 1s; }
      .beam-wave { animation: beamShimmer 5s ease-in-out infinite; }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .mono-text {
        font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, monospace;
      }
    </style>
  </defs>

  <!-- 1. Canvas Base & Ambient Glows -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#cyber-grid)" rx="16" />
  <rect width="1200" height="420" fill="url(#glow-cyan)" rx="16" />
  <rect width="1200" height="420" fill="url(#glow-purple)" rx="16" />
  <rect width="1200" height="420" fill="url(#glow-green)" rx="16" />

  <!-- Outer Border Glow -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- 2. Dynamic Routing Flow Lines in Background -->
  <g class="beam-wave" opacity="0.65">
    <!-- Stream Curve Top -->
    <path d="M-50,90 C 250,30 350,150 600,100 C 850,50 950,140 1250,80" fill="none" stroke="url(#flow-cyan)" stroke-width="2.5" class="anim-flow-1" />
    
    <!-- Stream Curve Mid/Low -->
    <path d="M-50,320 C 200,380 400,270 650,330 C 900,390 1050,300 1250,340" fill="none" stroke="url(#flow-purple)" stroke-width="2.5" class="anim-flow-2" />
    
    <!-- Diagonal Interconnectors -->
    <path d="M 120,70 L 260,180 L 180,310" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" class="anim-flow-3" />
    <path d="M 1080,70 L 960,190 L 1020,330" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.3" class="anim-flow-3" />
  </g>

  <!-- Pulsing Router Nodes -->
  <circle cx="260" cy="180" r="4" fill="#38bdf8" class="pulse-1" />
  <circle cx="600" cy="100" r="5" fill="#a855f7" class="pulse-2" />
  <circle cx="960" cy="190" r="4" fill="#34d399" class="pulse-3" />
  <circle cx="650" cy="330" r="4" fill="#38bdf8" class="pulse-1" />

  <!-- 3. Dynamic Side Metric Cards (Floating in mid-layer background, clear of center) -->
  <!-- Left Card: Cost Reduction Metric -->
  <g class="card-float-left" transform="translate(45, 95)" filter="url(#card-shadow)">
    <rect width="185" height="74" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="26" cy="28" r="10" fill="#0284c7" fill-opacity="0.25" />
    <text x="26" y="32" font-size="12" text-anchor="middle" fill="#38bdf8">📉</text>
    <text x="44" y="26" class="sub-text" font-size="11" fill="#94a3b8" font-weight="600">INFERENCE COST</text>
    <text x="44" y="47" class="mono-text" font-size="18" fill="#34d399" font-weight="700">-65% to -85%</text>
    <text x="44" y="62" class="sub-text" font-size="9" fill="#64748b">via Dynamic Routing</text>
  </g>

  <!-- Left Lower Card: Semantic Caching -->
  <g class="card-float-bottom" transform="translate(60, 245)" filter="url(#card-shadow)">
    <rect width="175" height="64" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="24" cy="24" r="10" fill="#059669" fill-opacity="0.25" />
    <text x="24" y="28" font-size="11" text-anchor="middle">⚡</text>
    <text x="42" y="24" class="sub-text" font-size="10.5" fill="#94a3b8" font-weight="600">SEMANTIC CACHE</text>
    <text x="42" y="43" class="mono-text" font-size="15" fill="#38bdf8" font-weight="700">8ms P95 Hit</text>
    <text x="42" y="56" class="sub-text" font-size="8.5" fill="#64748b">Zero Upstream Cost</text>
  </g>

  <!-- Right Card: Gateway & Cascade Routing -->
  <g class="card-float-right" transform="translate(970, 95)" filter="url(#card-shadow)">
    <rect width="185" height="74" rx="10" fill="url(#card-grad)" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="26" cy="28" r="10" fill="#7c3aed" fill-opacity="0.25" />
    <text x="26" y="32" font-size="12" text-anchor="middle">🔀</text>
    <text x="44" y="26" class="sub-text" font-size="11" fill="#94a3b8" font-weight="600">TIER CASCADE</text>
    <text x="44" y="47" class="mono-text" font-size="16" fill="#c084fc" font-weight="700">Ollama → Groq → GPT</text>
    <text x="44" y="62" class="sub-text" font-size="9" fill="#64748b">Quality-Gated Fallback</text>
  </g>

  <!-- Right Lower Card: Batching & Serving -->
  <g class="card-float-bottom" transform="translate(965, 245)" filter="url(#card-shadow)">
    <rect width="180" height="64" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="24" cy="24" r="10" fill="#0284c7" fill-opacity="0.25" />
    <text x="24" y="28" font-size="11" text-anchor="middle">🚀</text>
    <text x="42" y="24" class="sub-text" font-size="10.5" fill="#94a3b8" font-weight="600">THROUGHPUT</text>
    <text x="42" y="43" class="mono-text" font-size="15" fill="#34d399" font-weight="700">vLLM &amp; SGLang</text>
    <text x="42" y="56" class="sub-text" font-size="8.5" fill="#64748b">Continuous Batching</text>
  </g>

  <!-- 4. FOREGROUND: Center Main Title & Subtitles (Always Crisp and Clear) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Category Super-Badge -->
    <rect x="-140" y="-85" width="280" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="-120" cy="-71" r="4" fill="#10b981" />
    <text x="5" y="-67" class="sub-text" font-size="11.5" fill="#38bdf8" font-weight="700" letter-spacing="1.5">PRODUCTION AI INFRASTRUCTURE</text>

    <!-- Main Title Line 1 -->
    <text x="0" y="-18" class="title-text" font-size="34" fill="#ffffff" letter-spacing="0.5">
      Awesome Model Inference
    </text>

    <!-- Main Title Line 2 (Glowing Gradient) -->
    <text x="0" y="28" class="title-text" font-size="42" fill="url(#title-grad)" filter="url(#neon-glow)">
      Cost Optimization
    </text>

    <!-- Subtitle -->
    <text x="0" y="72" class="sub-text" font-size="15" fill="#94a3b8" letter-spacing="0.3">
      Curated Ecosystem of Intelligent Routing, Model Cascades, Gateways &amp; Compute Efficiency
    </text>

    <!-- Foreground Feature Pills -->
    <g transform="translate(0, 105)">
      <!-- Pill 1 -->
      <g transform="translate(-270, 0)">
        <rect x="-65" y="-12" width="130" height="26" rx="13" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" class="sub-text" font-size="10.5" fill="#38bdf8" font-weight="600" text-anchor="middle">🔀 Smart Routing</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-90, 0)">
        <rect x="-65" y="-12" width="130" height="26" rx="13" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" class="sub-text" font-size="10.5" fill="#c084fc" font-weight="600" text-anchor="middle">⚡ Cascade Tiers</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(90, 0)">
        <rect x="-65" y="-12" width="130" height="26" rx="13" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" class="sub-text" font-size="10.5" fill="#34d399" font-weight="600" text-anchor="middle">💾 Semantic Caching</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(270, 0)">
        <rect x="-65" y="-12" width="130" height="26" rx="13" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" class="sub-text" font-size="10.5" fill="#fbbf24" font-weight="600" text-anchor="middle">🛡️ AI Gateways</text>
      </g>
    </g>
  </g>
</svg>
